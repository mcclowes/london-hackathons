name: Submit an event
description: A London hackathon or hands-on build session we're missing.
title: "Event: "
labels: [event-submission]
body:
  - type: input
    id: url
    attributes:
      label: Event link
      description: A Luma or Partiful link is all we need. Otherwise, fill in the details below.
      placeholder: https://luma.com/...
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title
  - type: input
    id: when
    attributes:
      label: Date and time
      placeholder: 2026-10-17 09:00–18:00
  - type: input
    id: venue
    attributes:
      label: Venue
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Is there an organiser calendar we should follow instead?
